<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Quote Notes</title>
    <meta http-equiv="refresh" content="21600">
    <style>
        :root {
            --bg-color: #202020;
            --text-color: #e1e0e0;
            --form-bg: #393838;
            --header-color: #02a3b1;
            --subtitle-color: #95a5a6;
            --output-hover: #2570a2;
            --output-active: #1c5a7d;
            --copy-notice-color: #d1d7db;
            --required-color: #e74c3c;
            --border-color: #9c9c9c;
            --input-bg: #4b4b4b;
            --box-shadow: rgba(0, 0, 0, 0.9);
        }

        .dark-mode {
            --bg-color: #c4c3c3;
            --text-color: #333;
            --form-bg: #e0e0e0;
            --header-color: #00808C;
            --subtitle-color: #525b5c;
            --output-hover: #354a5f;
            --output-active: #1a252f;
            --copy-notice-color: #9baaab;
            --required-color: #e74c3c;
            --border-color: #b8b8b8;
            --input-bg: #f5f5f5;
            --box-shadow: rgba(0, 0, 0, 0.3);
        }
        @font-face {
            font-family: 'Lucida Sans';
            src: local('Lucida Sans')
                 url('https://fonts.cdnfonts.com/css/lucida-sans') format('woff');
        }
        * {
            box-sizing: border-box;
            font-family: 'Lucida Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 8px;
        }
        h1 {
            color: var(--header-color);
            margin-bottom: 1px;
            margin-top: 8px;
        }
        .subtitle {
            color: var(--subtitle-color);
            font-style: italic;
        }
        .form-section {
            background-color: var(--form-bg);
            padding: 16px;
            padding-bottom: 9px;
            padding-top: 14px;
            border-radius: 10px;
            box-shadow: 0 3px 9px var(--box-shadow);
            margin-bottom: 25px;
            margin-top: -10px;
        }
        .form-group {
            margin-bottom: 8px;
            justify-content: center;
            font-size: 16px;
            height: 60px
        }
        label {
            display: flex;
            margin-bottom: -1px;
            margin-top: 0px;
            font-size: 12px;
            font-weight: 600;
            height: 20px;
            padding-left: 15px;
            text-transform: uppercase;
        }
        input[type="text"] {
            width: 100%;
            padding: 7px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-size: 16px;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        input[type="date"] {
            width: 96%;
            max-height: 96%;
            margin-bottom: 9px;
            margin-top: 0px;
            padding: 5px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-size: 16px;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
            justify-content: space-evenly;
        }
        input[type="checkbox"] {
            margin-left: 12px;
            transform: scale(1.8);
        }
        select {
            width: 100%;
            padding: 7px;
            border: 2px solid var(--border-color);
            border-radius: 20px;
            font-size: 16px;
            text-align: center;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        .output-section {
            background-color: var(--header-color);
            color: rgb(255, 255, 255);
            padding: 24px;
            padding-top: 18px;
            padding-bottom: 14px;
            margin-bottom: 20px;
            border-radius: 20px;
            box-shadow: 0 3px 12px var(--box-shadow);
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .output-section:hover {
            background-color: var(--output-hover);
        }
        .output-section:active {
            background-color: var(--output-active);
        }
        .output-text {
            white-space: pre-line;
            text-align: center;
            line-height: 1.5;
            font-size: 18px;
        }
        .copy-notice {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            color: var(--copy-notice-color);
        }
        .checkbox-group {
            display: grid;
            align-items: center;
        }
        .required {
            color: var(--required-color);
            padding-left: 3px;
            font-size: 17pt;
            line-height: 80%;
        }
        .disclaimer {
            text-align: center;
            color: var(--subtitle-color);
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
            font-style: italic;
        }
        
        /* Inline form group styling */
        .inline-form-group {
            display: flex;
            margin-bottom: 12px;
            flex-wrap: nowrap;
            gap: 20px;
            align-items: stretch;
            justify-content: space-between;
        }
        .inline-form-group .form-group {
            margin-bottom: -6px;
            flex: 1;
            min-width: 80px;
        }
        .inline-form-group .checkbox-group {
            margin-top: 0px;
            display: grid;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        ::placeholder {
            color: var(--border-color);
            opacity: 1;
        }
        
        /* Dark mode toggle button */
        #darkModeToggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--header-color);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: background-color 0.3s;
        }
        #darkModeToggle:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <button id="darkModeToggle">☀︎</button>
    
    <header>
        <h1>Quick Quote Notes</h1>
        <p class="subtitle">Complete the form to generate copy text.</p>
    </header>

    <section class="form-section">
        <div class="inline-form-group">
        <div class="form-group">
            <label for="author">Author:<span class="required">*</span></label>
            <input type="text" id="author" placeholder="Enter author name">
        </div>
        
        <div class="form-group">
            <label for="quoteTotal">Quoted Price ($):<span class="required">*</span></label>
            <input type="text" id="quoteTotal" placeholder="Enter amount">
        </div>
        </div>

        <div class="form-group">
            <label for="expiration">Expiration Date:<span class="required">*</span></label>
            <input type="date" id="expiration">
        </div>
        
        <!-- Inline form group for discount, hero, and financing -->
        <div class="inline-form-group" style="gap:0px">
            <div class="form-group">
                <label for="discount">Discount:</label>
                <!--<input type="text" id="discount" placeholder="Enter %">-->
                    <select id="discount">
                    <option value="0" selected></option>
                    <option value="5">5%</option>
                    <option value="10">10%</option>
                    <option value="15">15%</option>
                    <option value="20">20%</option>
                    <option value="25">25%</option>
                    <option value="30">30%</option>
                    <option value="35">35%</option>
                    <option value="40">40%</option>
                    <option value="1">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <div class="checkbox-group">
                    <label for="hero" style="padding-left:0">Hero?</label>
                    <input type="checkbox" id="hero">
                </div>
            </div>
            
            <div class="form-group">
                <label for="financing">Financing:</label>
                <select id="financing">
                    <option value="" selected></option>
                    <option value="6">6 months</option>
                    <option value="12">12 months</option>
                    <option value="18">18 months</option>
                    <option value="24">24 months</option>
                    <option value="30">30 months</option>
                    <option value="36">36 months</option>
                </select>
            </div>
        </div>
        
        <div class="form-group">
            <label for="customNote">Custom Note:</label>
            <input type="text" id="customNote" placeholder="Enter custom note">
        </div>
    </section>

    <section class="output-section" id="outputSection">
        <div class="output-text" id="outputText">Please fill in the required fields to generate the quote text.</div>
        <div class="copy-notice">Click to copy to clipboard</div>
    </section>

    <div class="disclaimer">- ver. 1.2.7 -</div>
    <div class="disclaimer">For demonstration purposes only.<br>Not affiliated with The Lovesac Company.</div>

    <script>
        // Get DOM elements
        const authorInput = document.getElementById('author');
        const quoteTotalInput = document.getElementById('quoteTotal');
        const discountInput = document.getElementById('discount');
        const heroCheckbox = document.getElementById('hero');
        const financingInput = document.getElementById('financing');
        const expirationInput = document.getElementById('expiration');
        const customNoteInput = document.getElementById('customNote');
        const outputText = document.getElementById('outputText');
        const outputSection = document.getElementById('outputSection');
        const darkModeToggle = document.getElementById('darkModeToggle');

        // Format number as currency
        function formatCurrency(amount) {
            return parseFloat(amount).toLocaleString('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        // Calculate days until expiration
        function getDaysUntilExpiration(expirationDate) {
            const today = new Date();
            today.setHours(4, 0, 0, 0); // Set to beginning of day for accurate day count
            
            const expDate = new Date(expirationDate);
            expDate.setHours(20, 0, 0, 0); // Set to beginning of day for accurate day count
            
            const diffTime = expDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays;
        }

        // Format today's date
        function getFormattedToday() {
            const today = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[today.getDay()];
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const year = String(today.getFullYear()).slice(-2);
            return `${dayName}. ${month}/${day}/${year}`;
        }

        // Calculate monthly payment
        function calculateMonthlyPayment(total, months) {
            return Math.ceil(total / months);
        }

        // Format date as MM/DD/YY
        function formatDate(dateString) {
            const date = new Date(dateString);
            // Add timezone offset to prevent date shifting
            const timezoneOffset = date.getTimezoneOffset() * 60000;
            const adjustedDate = new Date(date.getTime() + timezoneOffset);
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const dayName = days[adjustedDate.getDay()];
            const month = adjustedDate.getMonth() + 1;
            const day = adjustedDate.getDate();
            return `${dayName}. ${month}/${day}`;
        }

        // Update output text
        function updateOutput() {
            const author = authorInput.value || '';
            const quoteTotal = parseFloat(quoteTotalInput.value) || 0;
            const discount = parseFloat(discountInput.value) || 0;
            const isHero = heroCheckbox.checked;
            const financing = parseInt(financingInput.value) || 0;
            const expirationDate = expirationInput.value;
            const customNote = customNoteInput.value;
            
            // Check if required fields are filled
            if (!author || !quoteTotal || !expirationDate) {
                outputText.textContent = 'Please fill in the required fields to generate the quote text.';
                return;
            }
            
            // Calculate values
            const monthlyPayment = financing > 0 ? calculateMonthlyPayment(quoteTotal, financing) : 0;
            const daysUntilExpiration = getDaysUntilExpiration(expirationDate);
            const todayFormatted = getFormattedToday();
            const formattedExpDate = formatDate(expirationDate);
            
            // Build output text
            let output = '';
            
            // Custom note if provided
            if (customNote) {
                output += `(${customNote})  `;
            }
            
            // Price section
            output += `{{ ${formatCurrency(quoteTotal)}`;

            // Add monthly payment if financing is specified
            if (financing > 0) {
                output += ` or $${monthlyPayment}/mo. for ${financing} mos.`;
            }
            
            // Add discount if specified
            if (discount == 0) {
                output += ` at MSRP`;
            }
            if (discount >= 5) {
                output += ` after ${discount}% off`;
            }
            if (discount == 1) {
                output += ` with current promo`;
            }

            // Add Heroes Code if checked
            if (isHero) {
                output += ' plus Heroes Code**';
            }
            
            output += ' }}   ';
            
    // Expiration section - UPDATED based on days until expiration
    let expirationMessage = '';
    if (daysUntilExpiration === 0) {
        expirationMessage = `....EXPIRES TODAY, ${formattedExpDate}....`;
    } else if (daysUntilExpiration === 1) {
        expirationMessage = `....EXPIRES TOMORROW, ${formattedExpDate}....`;
    } else {
        expirationMessage = `....EXPIRES in ${daysUntilExpiration} days on ${formattedExpDate}....`;
    }
    output += expirationMessage + '   ';
            
            // Heroes message if checked
            if (isHero) {
                output += ' **Visit LOVESAC.COM/HEROES to apply!   ';
            }
            
            // Author & Date
            output += `--by ${author} on ${todayFormatted}--`;
            
            outputText.textContent = output;
        }

        // Copy to clipboard functionality
        outputSection.addEventListener('click', function() {
            const textToCopy = outputText.textContent;
            
            // Don't copy if it's the placeholder text
            if (textToCopy.includes('Please fill in')) {
                return;
            }
            
            // Create a temporary textarea element to copy from
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            
            // Show visual feedback
            const originalText = outputSection.querySelector('.copy-notice').textContent;
            outputSection.querySelector('.copy-notice').textContent = 'Copied to clipboard!';
            
            setTimeout(() => {
                outputSection.querySelector('.copy-notice').textContent = originalText;
            }, 2000);
        });

        // Add event listeners for live updates
        const inputs = [authorInput, quoteTotalInput, discountInput, heroCheckbox, 
                       financingInput, expirationInput, customNoteInput];
        
        inputs.forEach(input => {
            if (input.type === 'checkbox') {
                input.addEventListener('change', updateOutput);
            } else {
                input.addEventListener('input', updateOutput);
            }
        });

        // Reset expiration date to today if user picks a date before today
        expirationInput.addEventListener('change', function() {
            enforceMinExpirationDate();
            updateOutput();
        });

        // Dark mode toggle functionality
        darkModeToggle.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                darkModeToggle.textContent = '⏾';
            } else {
                darkModeToggle.textContent = '☀︎';
            }
        });

        // Default expiration date to today
        function setDefaultExpirationDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            expirationInput.value = `${year}-${month}-${day}`;
        }

        // If expiration date is set to before today, reset it to today
function enforceMinExpirationDate() {
    if (!expirationInput.value) return;
    if (getDaysUntilExpiration(expirationInput.value) < 0) {
        setDefaultExpirationDate();
    }
}

        setDefaultExpirationDate();

        // Initial update
        updateOutput();
    </script>
</body>
</html>
